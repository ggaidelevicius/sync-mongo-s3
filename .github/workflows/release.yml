name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '(release')) &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select semver bump
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$REQUESTED_BUMP" in
              patch|minor|major) BUMP="$REQUESTED_BUMP" ;;
              *) echo "Invalid version increment" >&2; exit 1 ;;
            esac
          else
            git log -1 --format=%B > "$RUNNER_TEMP/release-message.txt"
            BUMP="$(node scripts/validate-commit-msg.mjs "$RUNNER_TEMP/release-message.txt" --release)"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Check formatting, tests, and publish contents
        run: pnpm check

      - name: Bump package version
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          RAW_VERSION="$(npm version "$BUMP" --no-git-tag-version)"
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json pnpm-lock.yaml
          git commit -m "Release v$RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"

          git push --atomic origin HEAD:main "v$RELEASE_VERSION"

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
