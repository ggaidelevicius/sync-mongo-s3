name: Bug report
description: Report a reproducible bug in @ggaidelevicius/sync-mongo-s3
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide a minimal reproducible case.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A concise bug summary.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command and relevant configuration, with credentials removed.
      placeholder: |
        1. Configure SYNC_* environment variables ...
        2. Run sync-mongo-s3 with ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Version of @ggaidelevicius/sync-mongo-s3
      placeholder: e.g. 0.1.1
    validations:
      required: true

  - type: input
    id: tool-versions
    attributes:
      label: External tool versions
      description: Include AWS CLI and MongoDB Database Tools versions for the affected operation.
      placeholder: aws --version, mongodump --version, and mongorestore --version
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: e.g. 22.14.0
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I can reproduce this with current package version.
          required: true
